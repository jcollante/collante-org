name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Type check
        run: npm run check

      - name: Build (includes Mermaid render + ADR integrity check)
        run: npm run build

      - name: Accessibility check (fails on serious/critical violations)
        run: npm run test:a11y

      - name: Lighthouse (informational — see note)
        # Non-blocking for now: this runs against `astro preview` on localhost,
        # not real network conditions, and content/fonts/images are still
        # placeholder-quality pre-launch. Phase 10 validates real 95+ scores
        # against the deployed production site; once that's done this step's
        # thresholds become a hard gate instead of informational.
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:4321/
            http://localhost:4321/architecture/enterprise-data-ai-platform/
          startServerCommand: npm run preview -- --port 4321
          startServerReadyPattern: "Preview server running"
          uploadArtifacts: true
          temporaryPublicStorage: true
